# A generic, single database configuration for DocChat Alembic migrations.

[alembic]
script_location = migrations
version_path_separator = os
output_encoding = utf-8

# Dynamic URL: Injected at runtime via migrations/env.py from .env (CONFIG.DATABASE_URL)
sqlalchemy.url =

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
